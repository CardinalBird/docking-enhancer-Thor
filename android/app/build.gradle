plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // Lint is a gate: any warning fails the build. The two dependency-age checks are off because
    // their answer depends on what was published yesterday, not on this code; upgrades are their own PR.
    lint {
        warningsAsErrors = true
        abortOnError = true
        disable += ["GradleDependency", "AndroidGradlePluginVersion"]
    }
    namespace = "com.controlswitch"
    // Compose 1.12 / core 1.19 / activity 1.13 / lifecycle 2.11 refuse to build against less
    // than 37. Compile-only; targetSdk below still decides runtime behaviour.
    compileSdk 37

    defaultConfig {
        applicationId "com.controlswitch"
        minSdk 28
        // Newer lint flags any targetSdk below the latest release. Raising it changes runtime
        // behaviour on the device, so it is its own PR, like the dependency-age checks above.
        //noinspection OldTargetApi
        targetSdk 35
        versionCode 8
        versionName "0.6.0"
        buildConfigField "boolean", "FORCE_DOCK_MODE_FOR_DEV", "false"
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // The classes under test here are the supervisor's shared state and the editor's state
        // machine, both plain Kotlin. Stubbing the framework calls they never make keeps them
        // testable on the JVM without pulling in Robolectric. Same setting as :data.
        unitTests.returnDefaultValues = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "FORCE_DOCK_MODE_FOR_DEV", "true"
        }

        release {
            // No debug-key fallback: without keystore.properties the release APK is left UNSIGNED
            // (uninstallable) instead of silently shipping signed with whatever debug keystore this
            // machine happens to have — which would break update continuity for users.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation project(":domain")
    implementation project(":data")

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.activity.compose

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    debugImplementation libs.androidx.ui.tooling

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
}
